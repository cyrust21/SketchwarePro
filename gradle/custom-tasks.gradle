/**
 * Creates a mock google-services.json if GOOGLE_SERVICES_JSON environment variable is absent.
 * Logika dijalankan pada fase konfigurasi agar plugin Google Services mendeteksi file lebih awal.
 */

def secrets = System.getenv("GOOGLE_SERVICES_JSON")
def rootMockFile = file("google-services.json")

// 1. Cek apakah ada rahasia (secrets) dari environment GitHub Actions
if (secrets != null && !secrets.trim().isEmpty()) {
    rootMockFile.text = secrets
} else {
    // 2. Jika tidak ada rahasia, pastikan tidak ada file kosong yang mengganggu
    if (rootMockFile.exists() && rootMockFile.length() == 0) {
        rootMockFile.delete()
    }
    
    // 3. Buat file dummy (palsu) tepat di direktori app/ (bukan di debug/)
    if (!rootMockFile.exists()) {
        def mockContent = """{
  "project_info": {
    "project_number": "123456789000",
    "firebase_url": "https://mock-project-default-rtdb.firebaseio.com",
    "project_id": "mock-project",
    "storage_bucket": "mock-project.appspot.com"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:123456789000:android:mockappid123456",
        "android_client_info": {
          "package_name": "${android.defaultConfig.applicationId}"
        }
      },
      "oauth_client": [],
      "api_key": [
        {
          "current_key": "mock_AIzaSyBQJCUXVKUjD38-u5pWkqMtesIfFvxAcvs"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": []
        }
      }
    }
  ],
  "configuration_version": "1"
}"""
        rootMockFile.text = mockContent
    }
}

// Mempertahankan struktur task agar preBuild.dependsOn tidak error
tasks.register('createMockGoogleServices') {
    doLast {
        println "Pengecekan google-services.json berhasil diselesaikan pada fase konfigurasi."
    }
}

preBuild.dependsOn createMockGoogleServices
